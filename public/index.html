<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>birkez</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>birkez</h1>
  <p class="lead">Adım 2 demosu: not tarayıcında şifrelenir, sunucu sadece anlamsız veri görür.</p>

  <div class="card">
    <label for="note">Notun</label>
    <textarea id="note" placeholder="Ör. Wi-Fi şifresi: ..."></textarea>
    <button id="encrypt">Şifrele</button>
    <p id="error" class="error" hidden></p>
  </div>

  <div id="out" class="card" hidden>
    <label>Sunucuya gidecek olan (şifreli not)</label>
    <p class="hint">Veritabanı çalınsa bile görülecek tek şey bu.</p>
    <div id="cipher" class="box"></div>

    <label class="spaced">Sadece linkte kalan anahtar</label>
    <p class="hint">Linkin # işaretinden sonraki kısmı. Tarayıcı bunu sunucuya hiç göndermez.</p>
    <div id="key" class="box"></div>

    <button id="decrypt">Alıcı gibi çöz</button>
    <p id="plain" class="result" hidden></p>
  </div>
</main>

<script type="module" src="/demo.js"></script>
</body>
</html>
