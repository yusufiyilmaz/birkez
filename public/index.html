<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>birkez</title>
  <style>
    :root {
      --bg: #f6f6f4; --card: #fff; --text: #1c1c1a; --muted: #6b6b66;
      --line: #e3e3de; --accent: #d9480f; --ok: #2b8a3e;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141413; --card: #1d1d1b; --text: #ececea; --muted: #9b9b95; --line: #2e2e2b; --accent: #ff8a4c; --ok: #69db7c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 28px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 120px; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
               background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
    button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent);
             color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .box { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all;
           background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .hint { color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
    .result { font-size: 18px; color: var(--ok); white-space: pre-wrap; }
    .error { color: var(--accent); }
    [hidden] { display: none; }
  </style>
</head>
<body>
<main>
  <h1>birkez</h1>
  <p class="lead">Adım 2 demosu: not tarayıcında şifrelenir, sunucu sadece anlamsız veri görür.</p>

  <div class="card">
    <label for="note">Notun</label>
    <textarea id="note" placeholder="Ör. Wi-Fi şifresi: ..."></textarea>
    <button id="encrypt">Şifrele</button>
    <p id="error" class="error" hidden></p>
  </div>

  <div id="out" class="card" hidden>
    <label>Sunucuya gidecek olan (şifreli not)</label>
    <p class="hint">Veritabanı çalınsa bile görülecek tek şey bu.</p>
    <div id="cipher" class="box"></div>

    <label style="margin-top:18px">Sadece linkte kalan anahtar</label>
    <p class="hint">Linkin # işaretinden sonraki kısmı. Tarayıcı bunu sunucuya hiç göndermez.</p>
    <div id="key" class="box"></div>

    <button id="decrypt">Alıcı gibi çöz</button>
    <p id="plain" class="result" hidden></p>
  </div>
</main>

<script type="module">
  import { encryptNote, decryptNote } from "./crypto.js";

  const $ = (id) => document.getElementById(id);
  let last = null;

  $("encrypt").addEventListener("click", async () => {
    $("error").hidden = true;
    $("plain").hidden = true;
    try {
      last = await encryptNote($("note").value);
      $("cipher").textContent = last.ciphertext;
      $("key").textContent = "#" + last.key;
      $("out").hidden = false;
    } catch (e) {
      $("error").textContent = e.message;
      $("error").hidden = false;
    }
  });

  $("decrypt").addEventListener("click", async () => {
    $("plain").textContent = await decryptNote(last);
    $("plain").hidden = false;
  });
</script>
</body>
</html>
